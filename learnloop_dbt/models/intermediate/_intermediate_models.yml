version: 2

models:
  - name: int_marketing_performance
    description: >
      Standardized daily advertising performance combining Google Ads
      and Meta Ads. The grain is one row per performance date,
      platform, and campaign.

    columns:
      - name: marketing_performance_id
        description: >
          Surrogate key generated from performance date, platform,
          and campaign ID.
        data_tests:
          - not_null
          - unique

      - name: performance_date
        description: Date on which the advertising activity occurred.
        data_tests:
          - not_null

      - name: platform
        description: Advertising platform that generated the record.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - google_ads
                  - meta_ads

      - name: campaign_id
        description: Campaign identifier from the source platform.
        data_tests:
          - not_null

      - name: campaign_name
        description: Campaign name from the source platform.

      - name: campaign_type
        description: Campaign classification from the source platform.

      - name: impressions
        description: Number of advertising impressions.
        data_tests:
          - not_null

      - name: clicks
        description: Number of advertising clicks.
        data_tests:
          - not_null

      - name: ad_spend
        description: Advertising expenditure.
        data_tests:
          - not_null

      - name: cost_per_click
        description: Advertising spend divided by clicks.

      - name: click_through_rate
        description: Clicks divided by impressions.

  - name: int_customer_revenue
    description: >
      Customer-level revenue and subscription summary built from
      Stripe payments and Stripe subscriptions. The grain is one row
      per Stripe customer.

    columns:
      - name: customer_id
        description: Unique Stripe customer identifier.
        data_tests:
          - not_null
          - unique

      - name: successful_payment_count
        description: Total number of successful payments made by the customer.
        data_tests:
          - not_null

      - name: total_revenue
        description: Total successful payment amount generated by the customer.
        data_tests:
          - not_null

      - name: first_payment_at
        description: Timestamp of the customer's first successful payment.

      - name: last_payment_at
        description: Timestamp of the customer's most recent successful payment.

      - name: latest_subscription_id
        description: Identifier of the customer's most recent subscription.

      - name: latest_subscription_status
        description: Status of the customer's most recent subscription.

      - name: latest_plan_id
        description: Identifier of the customer's latest subscription plan.

      - name: latest_plan_name
        description: Name of the customer's latest subscription plan.

      - name: latest_plan_interval
        description: Billing interval of the customer's latest subscription plan.

      - name: subscription_start_date
        description: Start date of the customer's latest subscription.

      - name: subscription_end_date
        description: End date of the customer's latest subscription, when applicable.

      - name: cancel_at_period_end
        description: Indicates whether the subscription will cancel at the end of the billing period.

      - name: current_period_start
        description: Start date of the current subscription billing period.

      - name: current_period_end
        description: End date of the current subscription billing period.

  - name: int_subscription_metrics
    description: >
      Subscription-level metrics derived from Stripe subscriptions.
      The grain is one row per subscription.

    columns:

      - name: subscription_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

      - name: plan_id
        data_tests:
          - not_null

      - name: plan_name
        data_tests:
          - not_null

      - name: monthly_price
        data_tests:
          - not_null

      - name: subscription_status
        data_tests:
          - not_null

      - name: subscription_start_date
        data_tests:
          - not_null

      - name: monthly_recurring_revenue
        data_tests:
          - not_null

      - name: annual_recurring_revenue
        data_tests:
          - not_null
  - name: int_customer_acquisition
    description: >
      Combines HubSpot CRM leads with GA4 website sessions.
      The grain is one row per lead.

    columns:

      - name: lead_id
        data_tests:
          - not_null
          - unique

      - name: user_id
        data_tests:
          - not_null

      - name: session_id
        data_tests:
          - not_null

      - name: lead_created_date
        data_tests:
          - not_null

      - name: lifecycle_stage
        data_tests:
          - not_null

      - name: original_source
        data_tests:
          - not_null

      - name: is_customer
        data_tests:
          - not_null
  - name: int_marketing_attribution
    description: >
      Campaign-level marketing attribution model combining advertising
      performance, customer acquisition, and customer revenue. The grain
      is one row per advertising platform and campaign.

    columns:
      - name: marketing_attribution_id
        description: >
          Surrogate key generated from advertising platform and campaign ID.
        data_tests:
          - not_null
          - unique

      - name: platform
        description: Advertising platform associated with the campaign.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - google_ads
                  - meta_ads

      - name: campaign_id
        description: Campaign identifier from the advertising platform.
        data_tests:
          - not_null

      - name: campaign_name
        description: Campaign name from the advertising platform.

      - name: total_impressions
        description: Total campaign advertising impressions.
        data_tests:
          - not_null

      - name: total_clicks
        description: Total campaign advertising clicks.
        data_tests:
          - not_null

      - name: total_ad_spend
        description: Total advertising expenditure for the campaign.
        data_tests:
          - not_null

      - name: total_leads
        description: Number of leads attributed to the campaign.
        data_tests:
          - not_null

      - name: total_mqls
        description: Number of marketing-qualified leads.

      - name: total_sqls
        description: Number of sales-qualified leads.

      - name: acquired_customers
        description: Number of attributed leads that became customers.
        data_tests:
          - not_null

      - name: paying_customers
        description: Number of attributed customers with Stripe revenue.

      - name: successful_payments
        description: Successful payments attributed to the campaign.

      - name: attributed_revenue
        description: Customer revenue attributed to the campaign.
        data_tests:
          - not_null

      - name: click_through_rate
        description: Total clicks divided by total impressions.

      - name: cost_per_lead
        description: Advertising spend divided by attributed leads.

      - name: customer_acquisition_cost
        description: Advertising spend divided by acquired customers.

      - name: lead_to_customer_rate
        description: Acquired customers divided by total leads.

      - name: return_on_ad_spend
        description: Attributed revenue divided by advertising spend.

      - name: marketing_roi
        description: >
          Attributed revenue minus advertising spend, divided by
          advertising spend.
